verified: true
metric_coordinates_verified: false
coordinate_units: figure_relative
coordinate_note: >-
  A1-A9 membership and sensor IDs transcribed from the supplied layout figure.
  Relative plan-view coordinates are approximate drawing coordinates, not surveyed
  metric coordinates. Relative topology is transcribed from the user-provided figure;
  metric coordinates remain unverified and must not be reported in metres. Heights
  follow the figure's (a,b,c) = (1m,2m,4m) legend.
